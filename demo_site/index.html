<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSight Demo Site</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    body.dark { background: #1e1e2e; color: #f0f0f0; }
    header { background: #2b4c7e; color: white; padding: 16px 24px; }
    header h1 { margin: 0 0 8px 0; }
    nav a { color: white; margin-right: 16px; }
    main { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    section { background: white; color: #222; padding: 16px; margin-bottom: 16px; border-radius: 6px; }
    body.dark section { background: #2a2a3c; color: #f0f0f0; }
    section:target { outline: 3px solid #f5a623; }
    label { display: block; margin-top: 8px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>OmniSight Demo Site</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h2>Login</h2>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter your username">

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password">

        <label><input id="remember" type="checkbox"> Remember me</label>

        <button type="submit">Login</button>
      </form>
      <p id="login-message" role="status"></p>
      <button id="theme-button" type="button">Toggle Theme</button>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>This small page exists only to practise browser automation.</p>
      <ul>
        <li>Navigation links</li>
        <li>A login form</li>
        <li>Buttons that change the page</li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: demo@omnisight.test</p>
    </section>
  </main>

  <script>
    // Login button: show a welcome message, or an error if a field is empty.
    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      var message = document.getElementById("login-message");
      if (username === "" || password === "") {
        message.textContent = "Please enter username and password.";
      } else {
        message.textContent = "Welcome, " + username + "!";
      }
    });

    // Toggle Theme button: switches between light and dark colours.
    document.getElementById("theme-button").addEventListener("click", function () {
      document.body.classList.toggle("dark");
    });
  </script>
</body>
</html>
